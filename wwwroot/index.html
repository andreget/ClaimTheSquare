<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClaimTheSquare</title>
    <style>
        .myGrid {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
        }

        .myGrid>div {
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .myForm {
            display: grid;
            grid-template-columns: repeat(2, 150px);
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        let model;

        init();

        function updateView() {
            document.getElementById('app').innerHTML = /*HTML*/`
                ${createFormHtml()}
                <div class="myGrid">
                    ${createSquaresHtml()}
                </div>
            `;
        }

        function createSquaresHtml() {
            let html = '';
            for (let index = 0; index < 64; index++) {
                let textObject = model.textObjects.find(to => to.index == index);
                if (!textObject) {
                    html += /*HTML*/`<div><button onclick="claim(${index})">fyll</button></div>`;
                } else {
                    html += /*HTML*/`
                        <div style="color: ${textObject.foreColor}; background-color: ${textObject.backColor}">
                            ${textObject.text}
                        </div>`;
                }
            }
            return html;
        }

        function createFormHtml() {
            return /*HTML*/`
                <div class="myForm">
                    <div>Tekst:</div>
                    <div>
                        <input type="text" 
                               oninput="model.inputs.text=this.value" 
                               value="${model.inputs.text || ''}"
                               />
                    </div>
                    <div>Forgrunnsfarge:</div>                    
                    <div>${createColorSelect('model.inputs.foreColor')}</div>                    
                    <div>Bakgrunnsfarge:</div>                    
                    <div>${createColorSelect('model.inputs.backColor')}</div>                    
                </div>            
            `;
        }

        function createColorSelect(modelField) {
            const selectedColor = eval(modelField);
            let optionsHtml = '';
            const noneSelected = selectedColor == null ? 'selected' : '';
            for (let color of model.colors) {
                const selected = color == selectedColor ? 'selected' : '';
                optionsHtml += /*HTML*/`
                    <option ${selected}>${color}</option>
                `;
            }
            return /*HTML*/`    
                <select onchange="${modelField}=this.value">
                    <option ${noneSelected}></option>
                    ${optionsHtml}
                </select>
                `;
        }

        async function claim(index) {
            const inputs = model.inputs;
            if (inputs.foreColor == null
                || inputs.backColor == null
                || inputs.text == null
                || inputs.text.trim().length == 0
            ) return;

            // lag rute-objekt fra inputs
            const tmpSquare = { ...inputs };
            tmpSquare.index = index;
            
            // send rute-kravet til backend
            try {
                const response = await fetch('/api/squares', {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(tmpSquare)
                });

                // sjekker statuskode og oppdaterer i henhold til dette
                switch (response.status) {
                    case 201:
                        // rute-krav ble gjort
                        await getSquares();
                        clearInputs();
                        updateView();
                        break;
                    case 409:
                        // rute-krav ble ikke gjort. Rute er tatt av en annen
                        alert('Ruten er tatt av noen andre. Prøv å velge en annen rute');
                        await getSquares();
                        updateView();
                        break;
                    case 400:
                        // rute-krav feilet pga manglende verdier
                        alert('Ruten kunne ikke tas pga feil i input');
                        break;
                    default:
                        alert(`Noe gikk galt under forsøket på å ta rute\nStatuskode: ${response.status}`);
                }
            }
            catch (e) { 
                alert(`Noe gikk galt under forsøket på å ta rute\n${e}`);
            }
        }

        function clearInputs() { 
            model.inputs = {
                foreColor: null,
                backColor: null,
                text: null,
            };
        }

        async function init() {
            model = {
                inputs: {
                    foreColor: null,
                    backColor: null,
                    text: null,
                },
                colors: ["black", "white", "gray", "silver", "maroon", "red", "purple", "fuchsia", "green", "lime", "olive", "yellow", "navy", "blue", "teal", "aqua"],
                textObjects: []
            };

            await getSquares();

            updateView();
        }

        async function getSquares() { 
            // hent rutene fra backend
            const response = await fetch('/api/squares');
            if (!response.ok) {
                throw new Error(`Response status: ${response.status}`);
            }

            model.textObjects = await response.json();
        }
    </script>

</body>

</html>
